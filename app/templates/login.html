{% extends "base.html" %}
{% block title %}登录{% endblock %}
{% block content %}
<div class="max-w-sm mx-auto mt-20 bg-white shadow-md rounded-lg p-8">
  <h1 class="text-2xl font-bold text-center text-gray-900 mb-6">💰 财务系统</h1>
  {% if error %}
  <div class="mb-4 p-3 rounded bg-red-50 text-red-700 text-sm">{{ error }}</div>
  {% endif %}
  <form method="post" action="/login" class="space-y-4">
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">用户名</label>
      <input name="username" required autofocus
             class="w-full px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">密码</label>
      <input name="password" type="password" required
             class="w-full px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
    </div>
    <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700">登录</button>
  </form>
</div>
{% endblock %}
